name: seismic_monitor_app
description: "App de Monitoreo Sísmico - Consumo de la API pública de USGS Earthquake Hazards Program."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Networking
  http: ^1.2.1

  # Gestión de estado
  provider: ^6.1.2

  # Mapa (OpenStreetMap, no requiere API key)
  flutter_map: ^6.1.0
  latlong2: ^0.9.1

  # Gráficas para la pantalla de Estadísticas
  fl_chart: ^0.68.0
  material_charts: ^0.0.39
  candlesticks: ^3.0.1
  syncfusion_flutter_charts: ^34.2.8

  # Formateo de fechas en español
  intl: ^0.20.3

  # Persistencia local de preferencias (pantalla Ajustes)
  shared_preferences: ^2.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/icon/

# Configuración del ícono del launcher (Android/iOS/Web).
# Coloca tu imagen en assets/icon/app_icon.png y ejecuta:
#   flutter pub run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/icon/app_icon.png"
    background_color: "#3D3AC4"
    theme_color: "#3D3AC4"
  windows:
    generate: true
    image_path: "assets/icon/app_icon.png"
    icon_size: 256
